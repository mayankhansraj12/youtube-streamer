name: StreamSync CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build-push-containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Server
      uses: docker/build-push-action@v4
      with:
        context: ./server
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/server:latest
          ghcr.io/${{ github.repository }}/server:${{ github.sha }}

    - name: Build and Push Client
      uses: docker/build-push-action@v4
      with:
        context: ./client
        push: true
        build-args: |
          VITE_BACKEND_URL=https://api.your-production-url.com
        tags: |
          ghcr.io/${{ github.repository }}/client:latest
          ghcr.io/${{ github.repository }}/client:${{ github.sha }}
