version: '3.8'

services:
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Add other env vars here or use .env file
      # - MONGODB_URI=...
      # - JWT_SECRET=...

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      - server
